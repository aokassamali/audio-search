[project]
name = "audio-search"
version = "0.2.0"
description = "Search and grounded question answering over long-form audio"
requires-python = ">=3.13,<3.14"
dependencies = [
    "dagster==1.13.15",
    "fastapi==0.140.0",
    "faster-whisper==1.2.1",
    "httpx>=0.28.1",
    "numpy==2.4.6",
    "pydantic==2.13.4",
    "rank-bm25==0.2.2",
    "sentence-transformers==5.6.0",
    "uvicorn[standard]==0.51.0",
]

[dependency-groups]
dev = [
    "dagster-dg-cli==1.13.15",
    "dagster-webserver==1.13.15",
    "jiwer==4.0.0",
    "pdfplumber==0.11.10",
]
